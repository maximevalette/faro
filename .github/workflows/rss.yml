name: Flux RSS Faro
on:
  schedule:
    - cron: "0 7,12 * * *"   # 2 fois par jour (UTC)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: mkdir -p public && python3 faro_rss.py -n 30 -o public/feed.xml --img-dir public/img --img-base https://maximevalette.github.io/faro/img
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  # Job séparé : déployer dans le même job que l'upload échouait parfois
  # (« No artifacts named github-pages were found »), l'archive n'étant pas encore visible.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
